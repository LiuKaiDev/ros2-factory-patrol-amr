geometry_validation_node:
  ros__parameters:
    use_sim_time: true
    min_depth: 0.2
    max_depth: 8.0
    roi_ratio: 0.3
    min_valid_samples: 5
    synthetic_bbox:
      center_u: 320.0
      center_v: 240.0
      width: 80.0
      height: 80.0
    sync_queue_size: 10
    sync_slop_sec: 0.05
    tf_timeout_sec: 0.1
    camera_frame: camera_color_optical_frame
    target_frame: map
    marker_scale: 0.18
    marker_namespace: geometry_validation
    ground_truth:
      enabled: true
      x: 2.70
      y: 0.0
      z: 0.495
