benchmark:
  profile: standard_wsl_cpu
  headless: true
  use_sim_time: true
  world: factory_patrol.sdf
  detector:
    warmup_samples: 5
    measured_samples: 30
    max_inference_rate_hz: 1.0
    timeout_sec: 120
  geometry:
    samples_per_condition: 10
    settle_samples: 3
    timeout_sec: 90
    conditions:
      - {name: near, model_x: 1.76, ground_truth: [1.70, 0.0, 0.495]}
      - {name: medium, model_x: 2.76, ground_truth: [2.70, 0.0, 0.495]}
      - {name: far, model_x: 3.76, ground_truth: [3.70, 0.0, 0.495]}
  mission:
    runs: 5
    timeout_sec: 150
    duplicate_observation_sec: 20
    standoff_distance_m: 1.2
  safety:
    runs: 10
    timeout_sec: 180
    stop_distance_m: 1.5
    slow_distance_m: 3.0
    speed_limit_linear_mps: 0.15
    speed_limit_angular_radps: 0.4
  invalid_depth:
    cases: 20
    settle_sec: 2
    timeout_sec: 45
